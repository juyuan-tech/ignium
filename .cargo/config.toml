# Cargo 构建配置(workspace 根)。
#
# 说明:
# - `build.target`:全 workspace 默认交叉编译到 RISC-V 裸机目标。
#   本地开发/调试如需原生构建,用 `--target` 显式覆盖。
# - `rustflags`:把链接脚本传给链接器。
#   **路径相对于运行 cargo 的工作目录(workspace 根)**,若移动
#   文件结构必须同步修改;从子目录运行 cargo 可能解析失败。

[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
# 链接脚本 kernel/linker.ld 显式收纳全部段 + /DISCARD/ 工具链噪音段。
# 注:不启用 --orphan-handling=warn/error —— lld 自建合成段
# (.symtab 等)会产生不可消除的告警并破坏 clippy 门禁;
# 新段靠代码 review 显式入脚本(见 AGENTS.md 红线 4)。
rustflags = [
  "-C", "link-arg=-Tkernel/linker.ld",
]
