# Ignium 用户态测试程序(M3 T1,独立 crate)。
#
# 非 workspace 成员(根 Cargo.toml `exclude = ["user"]`),由
# `kernel/build.rs` 经 cargo-in-cargo 构建(env `CARGO_TARGET_DIR=$OUT_DIR/
# user-target` 隔离 target 锁),产物拷入 `$OUT_DIR/hello.elf`,内核
# `include_bytes!` 内嵌 —— 详见 M3-DESIGN §3.5(方案 A)。
#
# syscall 号常量与 `kernel/src/syscall.rs` 一致(注释"须与 kernel 一致",
# 禁止在用户侧复制定义,见 docs/SYSCALLS.md 登记纪律)。

[package]
name = "ignium-user-hello"
version = "0.1.0"
edition = "2021"
description = "Ignium M3 T1 user test program (no_std ELF, loaded by kernel elf::load)"
license = "Apache-2.0"

[profile.release]
# 内核没有 unwinder,用户程序 panic 一律 abort(与内核 release profile 同约定)。
panic = "abort"
