name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf
          components: llvm-tools
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - run: cargo build --release
      - name: Boot test in QEMU
        run: timeout 10 qemu-system-riscv64 -M virt -m 128M -nographic -bios default \
          -kernel target/riscv64gc-unknown-none-elf/release/ignium-kernel 2>&1 \
          | grep -q "M0: boot ok"
