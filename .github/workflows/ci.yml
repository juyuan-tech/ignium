# Ignium CI:每个 push/PR 全量门禁。
#
# 门禁清单:编译(dev+release) → clippy(-D warnings)→ 格式检查 →
# QEMU 启动冒烟。新增质量门禁时在此追加,保持与本地 make 目标等价。

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: riscv64gc-unknown-none-elf
          components: llvm-tools, clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - run: cargo build
      - run: cargo build --release
      - run: cargo clippy --release -- -D warnings
      - run: cargo fmt --check
      - name: Boot test in QEMU (default CPU)
        run: |
          timeout 10 qemu-system-riscv64 -M virt -m 128M -nographic -bios default \
          -kernel target/riscv64gc-unknown-none-elf/release/ignium-kernel > /tmp/ignium-ci.log 2>&1 || true
          grep -q "M0: boot ok" /tmp/ignium-ci.log
          grep -q "buddy allocator selftest ok" /tmp/ignium-ci.log
          grep -q "Sv39 paging ok" /tmp/ignium-ci.log
          grep -q "kernel heap selftest ok" /tmp/ignium-ci.log
          grep -q "scheduler selftest ok" /tmp/ignium-ci.log
          grep -q "sync primitives selftest ok" /tmp/ignium-ci.log
          grep -q "M2: per-process address space ok" /tmp/ignium-ci.log
          test "$(grep -c 'uptime:' /tmp/ignium-ci.log)" -ge 2
          ! grep -qE "KERNEL PANIC|TRAP:" /tmp/ignium-ci.log
      # V3 审计 #11:多核引导仲裁回归测试纳入 CI。
      - name: SMP boot test (multi-hart arbitration)
        run: |
          timeout 10 qemu-system-riscv64 -M virt -m 128M -nographic -bios default -smp 4 \
          -kernel target/riscv64gc-unknown-none-elf/release/ignium-kernel > /tmp/ignium-smp.log 2>&1 || true
          test "$(grep -c 'M0: boot ok' /tmp/ignium-smp.log)" -eq 1
          ! grep -qE "KERNEL PANIC|TRAP:" /tmp/ignium-smp.log

  rva23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: riscv64gc-unknown-none-elf
          components: llvm-tools, clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      # RVA23 P1:独立 target 目录编译 Zba+Zbb+Zbs+Zicond,不污染标准 target/。
      - name: Build with RVA23 extensions
        run: CARGO_TARGET_DIR=target-rva23 cargo rustc -p ignium-kernel --release -- -C target-feature=+zba,+zbb,+zbs,+zicond
      # V3 审计 #11:RVA23 构建同样通过 clippy/fmt 门禁。
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check
      - name: Boot test in QEMU (-cpu max)
        run: |
          timeout 10 qemu-system-riscv64 -cpu max -M virt -m 128M -nographic -bios default \
          -kernel target-rva23/riscv64gc-unknown-none-elf/release/ignium-kernel > /tmp/ignium-rva23.log 2>&1 || true
          grep -q "M0: boot ok" /tmp/ignium-rva23.log
          grep -q "buddy allocator selftest ok" /tmp/ignium-rva23.log
          grep -q "Sv39 paging ok" /tmp/ignium-rva23.log
          grep -q "kernel heap selftest ok" /tmp/ignium-rva23.log
          grep -q "scheduler selftest ok" /tmp/ignium-rva23.log
          grep -q "sync primitives selftest ok" /tmp/ignium-rva23.log
          test "$(grep -c 'uptime:' /tmp/ignium-rva23.log)" -ge 2
          ! grep -qE "KERNEL PANIC|TRAP:" /tmp/ignium-rva23.log
