name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: riscv64gc-unknown-none-elf
          components: llvm-tools, clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - run: cargo build --release
      - run: cargo clippy --release -- -D warnings
      - run: cargo fmt --check
      - name: Boot test in QEMU
        run: |
          timeout 10 qemu-system-riscv64 -M virt -m 128M -nographic -bios default \
          -kernel target/riscv64gc-unknown-none-elf/release/ignium-kernel 2>&1 \
          | grep -q "M0: boot ok"
